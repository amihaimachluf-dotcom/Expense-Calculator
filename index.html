<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>קופה קטנה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Secular+One&display=swap">
<style>
/* Layout: one narrow phone column — navy month-total card on top, tabs, then either the category grid or the monthly summary; entry happens in a bottom sheet. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --ink:#141B26; --muted:#5C6676; --line:#D8DDE5;
  --accent:#1F4FD8; --accent-ink:#FFFFFF; --danger:#C2372B; --good:#1F8A4C;
  --hero:#15203A; --hero-ink:#F2F5FB; --hero-muted:#A9B5CC;
  --c-transport:#2F6FE0; --c-food:#D86F22; --c-clothing:#A847BF; --c-fuel:#C79600;
  --c-groceries:#26914F; --c-bills:#56677F; --c-fun:#D93D74; --c-health:#CC3535; --c-other:#737986;
  --f-display:"Secular One","Rubik",system-ui,sans-serif;
  --f-body:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --surface:#18202A; --ink:#E7ECF3; --muted:#93A0B2; --line:#2A3442;
  --accent:#7097FF; --accent-ink:#0A1020; --danger:#FF7B6F; --good:#5FD08E;
  --hero:#1C2A4D; --hero-ink:#F2F5FB; --hero-muted:#AAB6D0;
  --c-transport:#7AA5FF; --c-food:#FFA25E; --c-clothing:#D98BF0; --c-fuel:#F0CA4A;
  --c-groceries:#6CD394; --c-bills:#A4B2C7; --c-fun:#FF86AE; --c-health:#FF8383; --c-other:#B3B8C3;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#18202A; --ink:#E7ECF3; --muted:#93A0B2; --line:#2A3442;
  --accent:#7097FF; --accent-ink:#0A1020; --danger:#FF7B6F; --good:#5FD08E;
  --hero:#1C2A4D; --hero-ink:#F2F5FB; --hero-muted:#AAB6D0;
  --c-transport:#7AA5FF; --c-food:#FFA25E; --c-clothing:#D98BF0; --c-fuel:#F0CA4A;
  --c-groceries:#6CD394; --c-bills:#A4B2C7; --c-fun:#FF86AE; --c-health:#FF8383; --c-other:#B3B8C3;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.app{max-width:560px;margin:0 auto;padding-block:16px 96px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:18px 20px 20px;display:flex;flex-direction:column;gap:4px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-size:18px;letter-spacing:.01em}
.status{font-size:12px;color:var(--hero-muted)}
.hero-label{font-size:13px;color:var(--hero-muted);margin-top:10px}
.hero-total{font-family:var(--f-display);font-size:44px;line-height:1.1;letter-spacing:-.01em}
.hero-sub{font-size:13px;color:var(--hero-muted)}

/* tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tab{border:0;background:transparent;padding:10px;border-radius:9px;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

h2.sec{font-size:13px;font-weight:600;color:var(--muted);margin:0;letter-spacing:.02em}

/* category grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{--c:var(--c-other);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;
  transition:transform .12s ease,border-color .12s ease}
.tile:hover{border-color:var(--c)}
.tile:active{transform:scale(.97)}
.ico{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--c);
  background:color-mix(in srgb,var(--c) 15%,transparent)}
.ico svg{width:24px;height:24px}
.tile-name{font-weight:500;font-size:15px}
.tile-sum{font-size:12px;color:var(--muted);min-height:18px}

/* list */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .ico{width:36px;height:36px}
.row .ico svg{width:19px;height:19px}
.row-main{min-width:0}
.row-title{font-weight:500;overflow-wrap:anywhere}
.row-sub{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.row-amt{font-weight:600;white-space:nowrap}
.del{border:0;background:transparent;color:var(--muted);font-size:12px;padding:6px;border-radius:8px}
.del:hover{color:var(--danger)}
.del.arm{color:var(--danger);font-weight:600;background:color-mix(in srgb,var(--danger) 12%,transparent)}
.day-head{padding:10px 14px 6px;font-size:12px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;background:color-mix(in srgb,var(--line) 35%,transparent);border-top:1px solid var(--line)}
.day-head:first-child{border-top:0}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px 18px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}

/* summary */
.month-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.month-nav h2{font-family:var(--f-display);font-size:24px;margin:0;font-weight:400;text-wrap:balance}
.nav-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.nav-btn:disabled{opacity:.35;cursor:default}
.nav-btn svg{width:18px;height:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.stat-k{font-size:12px;color:var(--muted)}
.stat-v{font-family:var(--f-display);font-size:20px;line-height:1.25;overflow-wrap:anywhere}
.stat-v.big{font-size:26px}
.stat.wide{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.delta{font-size:13px;font-weight:500;padding:3px 9px;border-radius:999px}
.delta.up{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
.delta.down{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.delta.same{color:var(--muted);background:color-mix(in srgb,var(--muted) 12%,transparent)}
.bars{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:14px}
.bar{--c:var(--c-other);display:flex;flex-direction:column;gap:6px}
.bar-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bar-name{display:flex;align-items:center;gap:8px;font-weight:500}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.bar-val{font-size:14px;white-space:nowrap}
.bar-val span{color:var(--muted);font-size:12px;margin-inline-start:6px}
.track{height:10px;border-radius:999px;background:color-mix(in srgb,var(--line) 70%,transparent);overflow:hidden}
.fill{height:100%;border-radius:999px;background:var(--c)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(8,12,20,.45)}
.panel{position:relative;width:100%;max-width:560px;background:var(--surface);border-radius:22px 22px 0 0;
  padding-top:18px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;animation:up .2s ease-out;max-height:92%;overflow-y:auto}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:12px}
.sheet-head h3{margin:0;font-family:var(--f-display);font-size:22px;font-weight:400;flex:1}
.x{border:0;background:transparent;color:var(--muted);padding:8px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-width:0}
.amt-wrap{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px 14px}
.amt-wrap:focus-within{border-color:var(--accent)}
.amt-wrap span{font-family:var(--f-display);font-size:28px;color:var(--muted)}
.amt-wrap input{border:0;background:transparent;font-family:var(--f-display);font-size:34px;padding:4px 0;outline:none;text-align:right}
.err{color:var(--danger);font-size:13px;min-height:1em;margin:0}
.primary{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px;padding:14px;border-radius:12px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.note-local{font-size:12px;color:var(--muted);text-align:center}
@media (max-width:360px){.grid{gap:8px}.tile-name{font-size:14px}.hero-total{font-size:38px}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.tile{transition:none}}
</style>

<div class="app" dir="rtl" lang="he">
  <header class="hero">
    <div class="hero-top"><div class="brand">קופה קטנה</div><div class="status" id="status">טוען…</div></div>
    <div class="hero-label" id="heroLabel">הוצאות החודש</div>
    <div class="hero-total num" id="heroTotal">₪0</div>
    <div class="hero-sub" id="heroSub">עוד אין הוצאות החודש</div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabAdd" aria-selected="true">הוספת הוצאה</button>
    <button class="tab" role="tab" id="tabSum" aria-selected="false">סיכום חודשי</button>
  </div>

  <section id="viewAdd" style="display:flex;flex-direction:column;gap:18px">
    <div style="display:flex;flex-direction:column;gap:10px">
      <h2 class="sec">על מה הוצאת?</h2>
      <div class="grid" id="grid"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <h2 class="sec">אחרונות</h2>
      <div id="recent"></div>
    </div>
  </section>

  <section id="viewSum" hidden style="flex-direction:column;gap:16px">
    <div class="month-nav">
      <button class="nav-btn" id="prevM" aria-label="החודש הקודם"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <h2 id="monthTitle"></h2>
      <button class="nav-btn" id="nextM" aria-label="החודש הבא"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    </div>
    <div id="sumBody" style="display:flex;flex-direction:column;gap:16px"></div>
  </section>

  <p class="note-local" id="localNote" hidden>הנתונים נשמרים בדפדפן הזה בלבד.</p>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="scrim" id="scrim"></div>
  <form class="panel" id="form" dir="rtl" lang="he" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" novalidate>
    <div class="sheet-head">
      <div class="ico" id="sheetIco"></div>
      <h3 id="sheetTitle"></h3>
      <button type="button" class="x" id="closeBtn">סגירה</button>
    </div>
    <div class="field">
      <label for="amt">סכום</label>
      <div class="amt-wrap"><span>₪</span><input id="amt" inputmode="decimal" autocomplete="off" placeholder="0" class="num"></div>
    </div>
    <div class="field">
      <label for="note" id="noteLbl">הערה (לא חובה)</label>
      <input id="note" autocomplete="off" maxlength="80">
    </div>
    <div class="field">
      <label for="date">תאריך</label>
      <input id="date" type="date">
    </div>
    <p class="err" id="err"></p>
    <button class="primary" type="submit">שמירת הוצאה</button>
  </form>
</div>
<div class="toast" id="toast" hidden></div>

<script>
document.documentElement.lang='he';
const S='fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
const CATS=[
 {k:'transport',n:'נסיעות',i:`<svg viewBox="0 0 24 24" ${S}><rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 11h16M8 21v-4M16 21v-4"/><circle cx="8" cy="14" r=".6"/><circle cx="16" cy="14" r=".6"/></svg>`},
 {k:'food',n:'אוכל',i:`<svg viewBox="0 0 24 24" ${S}><path d="M7 3v18M4.5 3v5a2.5 2.5 0 0 0 5 0V3M17 21V3c-2.5 1.5-3.5 4.5-3.5 8h3.5"/></svg>`},
 {k:'clothing',n:'ביגוד',i:`<svg viewBox="0 0 24 24" ${S}><path d="M8.5 3 3 6l2 5 3-1.2V21h8V9.8l3 1.2 2-5-5.5-3a3.5 3.5 0 0 1-7 0z"/></svg>`},
 {k:'fuel',n:'דלק',i:`<svg viewBox="0 0 24 24" ${S}><path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h12M4 10h10M14 8h2a2 2 0 0 1 2 2v6.5a1.5 1.5 0 0 0 3 0V8.5L18 6"/></svg>`},
 {k:'groceries',n:'סופר',i:`<svg viewBox="0 0 24 24" ${S}><path d="M3 4h2.2l2.3 11h10.3L20 8H6.4"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>`},
 {k:'bills',n:'חשבונות',i:`<svg viewBox="0 0 24 24" ${S}><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3"/></svg>`},
 {k:'fun',n:'בילויים',i:`<svg viewBox="0 0 24 24" ${S}><path d="M12 3l2.6 5.5 6 .8-4.4 4.1 1.1 6L12 16.5l-5.3 2.9 1.1-6-4.4-4.1 6-.8z"/></svg>`},
 {k:'health',n:'בריאות',i:`<svg viewBox="0 0 24 24" ${S}><path d="M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.2a4.2 4.2 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/></svg>`},
 {k:'other',n:'אחר',i:`<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18" cy="12" r="1.8"/></svg>`},
];
const CAT=Object.fromEntries(CATS.map(c=>[c.k,c]));
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const curMonth=()=>todayStr().slice(0,7);
const fmt=n=>{const f=Math.round(n*100)%100!==0;return new Intl.NumberFormat('he-IL',{style:'currency',currency:'ILS',minimumFractionDigits:f?2:0,maximumFractionDigits:f?2:0}).format(n)};
const monthName=ym=>{const[y,m]=ym.split('-').map(Number);return new Intl.DateTimeFormat('he-IL',{month:'long',year:'numeric'}).format(new Date(y,m-1,1))};
const shiftMonth=(ym,d)=>{let[y,m]=ym.split('-').map(Number);m+=d;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return `${y}-${pad(m)}`};
const dayLabel=ds=>{const[y,m,d]=ds.split('-').map(Number);const dt=new Date(y,m-1,d);if(ds===todayStr())return 'היום';const yd=new Date();yd.setDate(yd.getDate()-1);if(dt.toDateString()===yd.toDateString())return 'אתמול';return new Intl.DateTimeFormat('he-IL',{weekday:'long',day:'numeric',month:'numeric'}).format(dt)};
const sum=a=>a.reduce((s,e)=>s+(+e.amount||0),0);
const sortDesc=a=>[...a].sort((x,y)=>(y.date||'').localeCompare(x.date||'')||(y.createdAt||'').localeCompare(x.createdAt||''));

let expenses=[], mode='loading', col=null, view='add', selMonth=curMonth(), curCat=null, armed=null;
const LS='kupa-ketana-v1';
const loadLocal=()=>{try{const v=JSON.parse(localStorage.getItem(LS)||'[]');return Array.isArray(v)?v:[]}catch(e){return []}};
const saveLocal=()=>{try{localStorage.setItem(LS,JSON.stringify(expenses))}catch(e){}};

let toastT;
function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
function setStatus(s){$('status').textContent=s}

/* ---------- render ---------- */
function rowHTML(e,showDate){
  const c=CAT[e.cat]||CAT.other;
  const title=e.cat==='other'&&e.note?e.note:c.n;
  const sub=[e.cat!=='other'&&e.note?e.note:'',showDate?dayLabel(e.date):''].filter(Boolean).join(' · ');
  const canDel=mode==='cloud'||mode==='local';
  return `<div class="row" style="--c:var(--c-${c.k})">
    <div class="ico">${c.i}</div>
    <div class="row-main"><div class="row-title">${esc(title)}</div>${sub?`<div class="row-sub">${esc(sub)}</div>`:''}</div>
    <div class="row-amt num">${fmt(+e.amount)}</div>
    ${canDel?`<button class="del${armed===e.id?' arm':''}" data-del="${esc(e.id)}">${armed===e.id?'למחוק?':'מחיקה'}</button>`:'<span></span>'}
  </div>`;
}
function renderHero(){
  const cm=curMonth(), list=expenses.filter(e=>(e.date||'').startsWith(cm));
  $('heroLabel').textContent='הוצאות '+monthName(cm);
  $('heroTotal').textContent=fmt(sum(list));
  $('heroSub').textContent=list.length?`${list.length} הוצאות עד עכשיו`:'עוד אין הוצאות החודש';
}
function renderAdd(){
  const cm=curMonth(), list=expenses.filter(e=>(e.date||'').startsWith(cm));
  $('grid').innerHTML=CATS.map(c=>{const s=sum(list.filter(e=>e.cat===c.k));
    return `<button class="tile" data-cat="${c.k}" style="--c:var(--c-${c.k})"><div class="ico">${c.i}</div><div class="tile-name">${c.n}</div><div class="tile-sum num">${s?fmt(s):''}</div></button>`}).join('');
  const recent=sortDesc(expenses).slice(0,8);
  $('recent').innerHTML=recent.length?`<div class="list">${recent.map(e=>rowHTML(e,true)).join('')}</div>`
    :`<div class="empty"><strong>${mode==='loading'?'טוען את ההוצאות…':'עוד לא נרשמו הוצאות'}</strong>${mode==='loading'?'':'לחץ על קטגוריה למעלה, הזן סכום, וההוצאה תופיע כאן.'}</div>`;
}
function renderSum(){
  $('monthTitle').textContent=monthName(selMonth);
  $('nextM').disabled=selMonth>=curMonth();
  const list=expenses.filter(e=>(e.date||'').startsWith(selMonth));
  const prev=expenses.filter(e=>(e.date||'').startsWith(shiftMonth(selMonth,-1)));
  if(!list.length){$('sumBody').innerHTML=`<div class="empty"><strong>אין הוצאות ב${esc(monthName(selMonth))}</strong>הוצאות שתוסיף לחודש הזה יסוכמו כאן לפי קטגוריה.</div>`;return}
  const total=sum(list), ptotal=sum(prev);
  const [y,m]=selMonth.split('-').map(Number);
  const days=selMonth===curMonth()?new Date().getDate():new Date(y,m,0).getDate();
  let delta='';
  if(ptotal>0){const p=Math.round((total-ptotal)/ptotal*100);
    delta=p>0?`<span class="delta up">${p}% יותר מהחודש הקודם</span>`:p<0?`<span class="delta down">${-p}% פחות מהחודש הקודם</span>`:`<span class="delta same">כמו בחודש הקודם</span>`}
  const byCat=CATS.map(c=>({c,s:sum(list.filter(e=>e.cat===c.k)),n:list.filter(e=>e.cat===c.k).length})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  const max=byCat[0].s;
  const groups={};sortDesc(list).forEach(e=>(groups[e.date]=groups[e.date]||[]).push(e));
  $('sumBody').innerHTML=`
    <div class="stats">
      <div class="stat wide"><div><div class="stat-k">סה״כ החודש</div><div class="stat-v big num">${fmt(total)}</div></div>${delta}</div>
      <div class="stat"><div class="stat-k">הוצאות</div><div class="stat-v num">${list.length}</div></div>
      <div class="stat"><div class="stat-k">ממוצע ליום</div><div class="stat-v num">${fmt(Math.round(total/days))}</div></div>
      <div class="stat"><div class="stat-k">הכי הרבה על</div><div class="stat-v">${byCat[0].c.n}</div></div>
    </div>
    <h2 class="sec">לפי קטגוריה</h2>
    <div class="bars">${byCat.map(x=>`<div class="bar" style="--c:var(--c-${x.c.k})">
      <div class="bar-top"><div class="bar-name"><span class="dot"></span>${x.c.n}</div>
      <div class="bar-val num">${fmt(x.s)}<span>${Math.round(x.s/total*100)}%</span></div></div>
      <div class="track"><div class="fill" style="width:${Math.max(2,x.s/max*100)}%"></div></div></div>`).join('')}</div>
    <h2 class="sec">כל ההוצאות</h2>
    <div class="list">${Object.keys(groups).map(d=>`<div class="day-head"><span>${esc(dayLabel(d))}</span><span class="num">${fmt(sum(groups[d]))}</span></div>${groups[d].map(e=>rowHTML(e,false)).join('')}`).join('')}</div>`;
}
function render(){
  renderHero();
  $('tabAdd').setAttribute('aria-selected',view==='add');$('tabSum').setAttribute('aria-selected',view==='sum');
  $('viewAdd').hidden=view!=='add';$('viewSum').hidden=view!=='sum';
  $('viewSum').style.display=view==='sum'?'flex':'';
  if(view==='add')renderAdd();else renderSum();
  $('localNote').hidden=mode!=='local';
}

/* ---------- storage ---------- */
function goLocal(){mode='local';expenses=loadLocal();setStatus('');render()}
async function init(){
  render();
  if(!window.claude||typeof window.claude.use!=='function'){goLocal();return}
  let db=null,user=null,uid=null;
  try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}catch(e){}
  if(user){try{uid=await user.id()}catch(e){}}
  if(!db||!uid){goLocal();return}
  try{col=db.doc('data/users/'+uid+'/ledger').collection('expenses')}catch(e){goLocal();return}
  const slow=setTimeout(()=>setStatus('החיבור איטי…'),10000);
  col.onSnapshot(snap=>{
    expenses=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(mode==='loading')mode='cloud';
    if(!snap.metadata.fromCache){clearTimeout(slow);setStatus('')}
    render();
  },err=>{clearTimeout(slow);if(mode==='loading')mode='cloud';setStatus('לא מחובר');toast('לא ניתן לטעון את ההוצאות כרגע');render()});
}
async function addExpense(e){
  if(mode==='local'){expenses.push({id:'l'+Date.now()+Math.random().toString(36).slice(2,6),...e});saveLocal();render();return}
  if(mode!=='cloud'){toast('רגע, עוד טוען…');return}
  try{await col.doc().set(e)}catch(err){
    if(err&&err.code==='invalid_argument'){mode='readonly';toast('אין לך הרשאה לשמור כאן');render()}
    else if(err&&err.code==='quota_exceeded')toast('האחסון מלא. מחק הוצאות ישנות ונסה שוב.');
    else toast('השמירה נכשלה. נסה שוב.');
  }
}
async function removeExpense(id){
  if(mode==='local'){expenses=expenses.filter(e=>e.id!==id);saveLocal();render();return}
  if(mode==='cloud'){try{await col.doc(id).delete()}catch(e){toast('המחיקה נכשלה. נסה שוב.')}}
}

/* ---------- sheet ---------- */
function openSheet(k){
  if(mode==='loading'){toast('רגע, עוד טוען…');return}
  if(mode==='readonly'){toast('אין לך הרשאה לשמור כאן');return}
  curCat=CAT[k];
  const f=$('form');f.style.setProperty('--c',`var(--c-${k})`);
  $('sheetIco').innerHTML=curCat.i;$('sheetTitle').textContent=curCat.n;
  $('noteLbl').textContent=k==='other'?'על מה? (חובה)':'הערה (לא חובה)';
  $('note').placeholder=k==='other'?'למשל: מתנה ליום הולדת':'';
  $('amt').value='';$('note').value='';$('date').value=todayStr();$('date').max=todayStr();$('err').textContent='';
  $('sheet').hidden=false;setTimeout(()=>$('amt').focus(),50);
}
function closeSheet(){$('sheet').hidden=true;curCat=null}
$('form').addEventListener('submit',ev=>{
  ev.preventDefault();
  const amount=Math.round(parseFloat(($('amt').value||'').replace(/[^\d.,]/g,'').replace(',','.'))*100)/100;
  const note=$('note').value.trim();const date=$('date').value||todayStr();
  if(!(amount>0)){$('err').textContent='הזן סכום גדול מאפס';$('amt').focus();return}
  if(curCat.k==='other'&&!note){$('err').textContent='כתוב על מה ההוצאה';$('note').focus();return}
  const e={cat:curCat.k,amount,note,date,createdAt:new Date().toISOString()};
  const name=curCat.n;closeSheet();addExpense(e);toast(`נשמר: ${fmt(amount)} על ${e.cat==='other'?note:name}`);
});
$('closeBtn').onclick=closeSheet;$('scrim').onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('sheet').hidden)closeSheet()});

/* ---------- events ---------- */
$('grid').addEventListener('click',e=>{const t=e.target.closest('[data-cat]');if(t)openSheet(t.dataset.cat)});
let armT;
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-del]');
  if(!b){if(armed){armed=null;render()}return}
  const id=b.dataset.del;
  if(armed===id){armed=null;clearTimeout(armT);removeExpense(id);render()}
  else{armed=id;render();clearTimeout(armT);armT=setTimeout(()=>{armed=null;render()},3500)}
});
function setView(v){view=v;if(v==='sum')selMonth=selMonth||curMonth();try{history.replaceState(null,'',v==='sum'?'#summary':'#')}catch(e){location.hash=v==='sum'?'summary':''}render();window.scrollTo({top:0})}
$('tabAdd').onclick=()=>setView('add');$('tabSum').onclick=()=>setView('sum');
$('prevM').onclick=()=>{selMonth=shiftMonth(selMonth,-1);render()};
$('nextM').onclick=()=>{if(selMonth<curMonth()){selMonth=shiftMonth(selMonth,1);render()}};
const fromHash=()=>{view=location.hash==='#summary'?'sum':'add'};
window.addEventListener('hashchange',()=>{fromHash();render()});
fromHash();init();
</script>

</body></html>
